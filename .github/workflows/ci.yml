name: FClinic CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  backend-build:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClinicAppointmentBE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean compile -B

      - name: Run Unit Tests
        run: mvn test -B --fail-at-end

  frontend-build:
    name: Frontend Build & Lint (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClinicAppointmentFE

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ClinicAppointmentFE/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
