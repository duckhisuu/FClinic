services:
  # ==============================================================================
  # PostgreSQL - Auth Service Database
  # ==============================================================================
  postgres-auth:
    image: postgres:16-alpine
    container_name: fclinic-postgres-auth
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${AUTH_DB_NAME:-auth_db}
    ports:
      - "${POSTGRES_AUTH_PORT:-5438}:5432"
    volumes:
      - auth_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${AUTH_DB_NAME:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # PostgreSQL - Keycloak Identity Database
  # ==============================================================================
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: fclinic-postgres-keycloak
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak_db}
    ports:
      - "${POSTGRES_KEYCLOAK_PORT:-5439}:5432"
    volumes:
      - keycloak_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${KEYCLOAK_DB_NAME:-keycloak_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Keycloak - OIDC Identity Provider & Authorization Server
  # ==============================================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: fclinic-keycloak
    restart: always
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${DB_USERNAME:-fclinic_admin}
      KC_DB_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ==============================================================================
  # PostgreSQL - Patient Service Database
  # ==============================================================================
  postgres-patient:
    image: postgres:16-alpine
    container_name: fclinic-postgres-patient
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${PATIENT_DB_NAME:-patient_db}
    ports:
      - "${POSTGRES_PATIENT_PORT:-5433}:5432"
    volumes:
      - patient_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${PATIENT_DB_NAME:-patient_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # PostgreSQL - Doctor Service Database
  # ==============================================================================
  postgres-doctor:
    image: postgres:16-alpine
    container_name: fclinic-postgres-doctor
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${DOCTOR_DB_NAME:-doctor_db}
    ports:
      - "${POSTGRES_DOCTOR_PORT:-5434}:5432"
    volumes:
      - doctor_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${DOCTOR_DB_NAME:-doctor_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # PostgreSQL - Appointment Service Database
  # ==============================================================================
  postgres-appointment:
    image: postgres:16-alpine
    container_name: fclinic-postgres-appointment
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${APPOINTMENT_DB_NAME:-appointment_db}
    ports:
      - "${POSTGRES_APPOINTMENT_PORT:-5435}:5432"
    volumes:
      - appointment_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${APPOINTMENT_DB_NAME:-appointment_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # PostgreSQL - Notification Service Database
  # ==============================================================================
  postgres-notification:
    image: postgres:16-alpine
    container_name: fclinic-postgres-notification
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-fclinic_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fclinic_secret}
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
    ports:
      - "${POSTGRES_NOTIFICATION_PORT:-5436}:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-fclinic_admin} -d ${NOTIFICATION_DB_NAME:-notification_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Redis - Distributed Lock & Caching
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: fclinic-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # RabbitMQ - Message Broker with Management UI
  # ==============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fclinic-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fclinic_rabbit}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbit_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fclinic-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==============================================================================
  # MailHog - Local SMTP sink for Notification Service (UI: http://localhost:8025)
  # ==============================================================================
  mailhog:
    image: mailhog/mailhog
    container_name: fclinic-mailhog
    restart: always
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - fclinic-network

volumes:
  auth_pgdata:
    driver: local
  keycloak_pgdata:
    driver: local
  patient_pgdata:
    driver: local
  doctor_pgdata:
    driver: local
  appointment_pgdata:
    driver: local
  notification_pgdata:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  fclinic-network:
    driver: bridge
