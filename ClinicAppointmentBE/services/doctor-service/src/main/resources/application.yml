server:
  port: 8082

doctor:
  references:
    appointment-client-id: ${APPOINTMENT_DOCTOR_CLIENT_ID:appointment-doctor-reference}
    appointment-client-secret: ${APPOINTMENT_DOCTOR_CLIENT_SECRET:}
    patient-client-id: ${PATIENT_DOCTOR_REFERENCE_CLIENT_ID:patient-doctor-reference}
    patient-client-secret: ${PATIENT_DOCTOR_REFERENCE_CLIENT_SECRET:}

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:ClinicAppointmentBE/.env[.properties]"
  application:
    name: doctor-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_DOCTOR_PORT:5434}/${DOCTOR_DB_NAME:doctor_db}
    username: ${DB_USERNAME:fclinic_admin}
    password: ${DB_PASSWORD:fclinic_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
