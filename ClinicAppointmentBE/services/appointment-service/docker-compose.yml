# Appointment only. The shared infrastructure and other services are owned separately.
services:
  appointment-service:
    image: ${APPOINTMENT_IMAGE:-fclinic/appointment-service:local}
    mem_limit: 512m
    build:
      context: ../..
      dockerfile: services/appointment-service/Dockerfile
    ports:
      - "127.0.0.1:${APPOINTMENT_HTTP_PORT:-8083}:8083"
    environment:
      APPOINTMENT_SERVICE_PORT: "8083"
      DB_HOST: ${APPOINTMENT_DB_HOST:-postgres-appointment}
      POSTGRES_APPOINTMENT_PORT: "5432"
      APPOINTMENT_DB_NAME: ${APPOINTMENT_DB_NAME:-appointment_db}
      DB_USERNAME: ${DB_USERNAME:?Supply the Appointment database user}
      DB_PASSWORD: ${DB_PASSWORD:?Supply the Appointment database password}
      APPOINTMENT_LOCK_PROVIDER: postgres
      APPOINTMENT_PATIENT_URL: ${APPOINTMENT_PATIENT_URL:-https://patient-service:8081}
      APPOINTMENT_DOCTOR_URL: ${APPOINTMENT_DOCTOR_URL:-https://doctor-service:8082}
      APPOINTMENT_SERVICE_TOKEN: ${APPOINTMENT_SERVICE_TOKEN:-}
      APPOINTMENT_RECIPIENT_URL: ${APPOINTMENT_RECIPIENT_URL:-https://auth-service:8085/api/v1/auth/internal/appointment-recipient-accounts}
      APPOINTMENT_AUTH_INTROSPECTION_URI: ${APPOINTMENT_AUTH_INTROSPECTION_URI:-https://auth-service:8085/api/v1/auth/introspect}
      APPOINTMENT_AUTH_CLIENT_ID: ${APPOINTMENT_AUTH_CLIENT_ID:-appointment-introspection}
      APPOINTMENT_AUTH_CLIENT_SECRET: ${APPOINTMENT_AUTH_CLIENT_SECRET:?Supply the Auth introspection credential}
      APPOINTMENT_SCOPE_URI: ${APPOINTMENT_SCOPE_URI:-https://auth-service:8085/api/v1/auth/scopes}
      APPOINTMENT_SCOPE_CLIENT_ID: ${APPOINTMENT_SCOPE_CLIENT_ID:-appointment-scope}
      APPOINTMENT_SCOPE_CLIENT_SECRET: ${APPOINTMENT_SCOPE_CLIENT_SECRET:?Supply the Auth scope credential}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?Supply the exact token issuer}
      APPOINTMENT_PATIENT_TOKEN_URI: ${APPOINTMENT_PATIENT_TOKEN_URI:?Supply the Keycloak token endpoint}
      APPOINTMENT_PATIENT_TOKEN_CLIENT_ID: ${APPOINTMENT_PATIENT_TOKEN_CLIENT_ID:-appointment-service}
      APPOINTMENT_PATIENT_TOKEN_CLIENT_SECRET: ${APPOINTMENT_PATIENT_TOKEN_CLIENT_SECRET:?Supply the Patient OAuth client secret}
      PATIENT_APPOINTMENT_REFERENCE_CLIENT_ID: ${PATIENT_APPOINTMENT_REFERENCE_CLIENT_ID:-patient-appointment-reference}
      PATIENT_APPOINTMENT_REFERENCE_CLIENT_SECRET: ${PATIENT_APPOINTMENT_REFERENCE_CLIENT_SECRET:?Supply the Patient reference credential}
      APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_ID: ${APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_ID:-notification-appointment-reference}
      APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_SECRET: ${APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_SECRET:?Supply the Notification reference credential}
      APPOINTMENT_DOCTOR_CLIENT_ID: ${APPOINTMENT_DOCTOR_CLIENT_ID:-appointment-doctor-reference}
      APPOINTMENT_DOCTOR_CLIENT_SECRET: ${APPOINTMENT_DOCTOR_CLIENT_SECRET:?Supply the Doctor reference credential}
      APPOINTMENT_RECIPIENT_CLIENT_ID: ${APPOINTMENT_RECIPIENT_CLIENT_ID:-appointment-recipient-accounts}
      APPOINTMENT_RECIPIENT_CLIENT_SECRET: ${APPOINTMENT_RECIPIENT_CLIENT_SECRET:?Supply the Auth recipient credential}
      APPOINTMENT_TRUST_STORE: ${APPOINTMENT_TRUST_STORE:-}
      APPOINTMENT_TRUST_STORE_PASSWORD: ${APPOINTMENT_TRUST_STORE_PASSWORD:-}
      APPOINTMENT_OUTBOX_ENABLED: ${APPOINTMENT_OUTBOX_ENABLED:-true}
      APPOINTMENT_REMINDER_LEAD: ${APPOINTMENT_REMINDER_LEAD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: "5672"
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-}
      EUREKA_ENABLED: ${EUREKA_ENABLED:-false}
      EUREKA_SERVER_URL: ${EUREKA_SERVER_URL:-http://discovery-server:8761/eureka/}
    networks:
      - clinic
networks:
  clinic:
    external: true
    name: ${APPOINTMENT_DOCKER_NETWORK:-clinicappointmentbe_fclinic-network}
