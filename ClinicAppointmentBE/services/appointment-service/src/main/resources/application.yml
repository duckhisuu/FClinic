server:
  port: ${APPOINTMENT_SERVICE_PORT:8083}
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:ClinicAppointmentBE/.env[.properties]"
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_APPOINTMENT_PORT:5435}/${APPOINTMENT_DB_NAME:appointment_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:}
    password: ${RABBITMQ_DEFAULT_PASS:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
appointment:
  lock-provider: ${APPOINTMENT_LOCK_PROVIDER:postgres}
  patient-url: ${APPOINTMENT_PATIENT_URL:http://localhost:8081}
  doctor-url: ${APPOINTMENT_DOCTOR_URL:http://localhost:8082}
  service-token: ${APPOINTMENT_SERVICE_TOKEN:}
  recipient-url: ${APPOINTMENT_RECIPIENT_URL:}
  outbox-enabled: ${APPOINTMENT_OUTBOX_ENABLED:true}
  reminder-lead: ${APPOINTMENT_REMINDER_LEAD:}
  outbox-poll-ms: ${APPOINTMENT_OUTBOX_POLL_MS:5000}
  reminder-poll-ms: ${APPOINTMENT_REMINDER_POLL_MS:30000}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.jdbc.support: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.bind: OFF
