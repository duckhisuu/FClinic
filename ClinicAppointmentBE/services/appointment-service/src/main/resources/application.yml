server:
  port: ${APPOINTMENT_SERVICE_PORT:8083}
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:ClinicAppointmentBE/.env[.properties]"
  application:
    name: appointment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_APPOINTMENT_PORT:5435}/${APPOINTMENT_DB_NAME:appointment_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 16
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    mapper:
      allow-coercion-of-scalars: false
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:}
    password: ${RABBITMQ_DEFAULT_PASS:}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
appointment:
  providers:
    doctor-client-id: ${APPOINTMENT_DOCTOR_CLIENT_ID:appointment-doctor-reference}
    doctor-client-secret: ${APPOINTMENT_DOCTOR_CLIENT_SECRET:}
    recipient-client-id: ${APPOINTMENT_RECIPIENT_CLIENT_ID:appointment-recipient-accounts}
    recipient-client-secret: ${APPOINTMENT_RECIPIENT_CLIENT_SECRET:}
  tls:
    trust-store: ${APPOINTMENT_TRUST_STORE:}
    trust-store-password: ${APPOINTMENT_TRUST_STORE_PASSWORD:}
  security:
    introspection-uri: ${APPOINTMENT_AUTH_INTROSPECTION_URI:http://localhost:8085/api/v1/auth/introspect}
    issuer: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fclinic}}
    audience: appointment-service
    client-id: ${APPOINTMENT_AUTH_CLIENT_ID:appointment-introspection}
    client-secret: ${APPOINTMENT_AUTH_CLIENT_SECRET:}
    scope-uri: ${APPOINTMENT_SCOPE_URI:http://localhost:8085/api/v1/auth/scopes}
    scope-client-id: ${APPOINTMENT_SCOPE_CLIENT_ID:appointment-scope}
    scope-client-secret: ${APPOINTMENT_SCOPE_CLIENT_SECRET:}
    patient-client-id: ${PATIENT_APPOINTMENT_REFERENCE_CLIENT_ID:patient-appointment-reference}
    patient-client-secret: ${PATIENT_APPOINTMENT_REFERENCE_CLIENT_SECRET:}
    notification-client-id: ${APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_ID:notification-appointment-reference}
    notification-client-secret: ${APPOINTMENT_NOTIFICATION_REFERENCE_CLIENT_SECRET:}
    patient-token-uri: ${APPOINTMENT_PATIENT_TOKEN_URI:}
    patient-token-client-id: ${APPOINTMENT_PATIENT_TOKEN_CLIENT_ID:appointment-service}
    patient-token-client-secret: ${APPOINTMENT_PATIENT_TOKEN_CLIENT_SECRET:}
  lock-provider: ${APPOINTMENT_LOCK_PROVIDER:postgres}
  patient-url: ${APPOINTMENT_PATIENT_URL:http://localhost:8081}
  doctor-url: ${APPOINTMENT_DOCTOR_URL:http://localhost:8082}
  service-token: ${APPOINTMENT_SERVICE_TOKEN:}
  recipient-url: ${APPOINTMENT_RECIPIENT_URL:http://localhost:8085/api/v1/auth/internal/appointment-recipient-accounts}
  outbox-enabled: ${APPOINTMENT_OUTBOX_ENABLED:true}
  reminder-lead: ${APPOINTMENT_REMINDER_LEAD:}
  outbox-poll-ms: ${APPOINTMENT_OUTBOX_POLL_MS:5000}
  reminder-poll-ms: ${APPOINTMENT_REMINDER_POLL_MS:30000}
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    org.springframework.jdbc.support: OFF
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.orm.jdbc.bind: OFF
