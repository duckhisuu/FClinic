server:
  port: 8081
spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:ClinicAppointmentBE/.env[.properties]"
  profiles:
    group:
      service-integration: [identity-introspection, scope-authority, appointment-reference, auth-registry]
  application:
    name: patient-service
  datasource:
    # Target must explicitly select a prepared fresh UUID database. No fallback to the legacy datasource.
    url: ${PATIENT_UUID_DB_URL:jdbc:postgresql://localhost:5433/patient_uuid}
    username: ${PATIENT_UUID_DB_USERNAME:fclinic_admin}
    password: ${PATIENT_UUID_DB_PASSWORD:fclinic_secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  level:
    # SQL error detail may contain clinical values. Error handler returns only typed generic codes.
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
