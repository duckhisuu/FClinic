# Synthetic localhost demo only. Credentials must be supplied externally.
patient:
  identity:
    allow-insecure-http: true
  scope:
    administrative:
      allow-insecure-http: true
    clinical:
      allow-insecure-http: true
  reference:
    doctor:
      collection-uri: ${PATIENT_DOCTOR_REFERENCE_URI:http://localhost:8082/api/v1/doctors}
    appointment:
      collection-uri: ${PATIENT_APPOINTMENT_REFERENCE_URI:http://localhost:8083/api/v2/appointments}
# Local profile permits loopback HTTP for Auth only. Non-local profiles require HTTPS/fail closed.
