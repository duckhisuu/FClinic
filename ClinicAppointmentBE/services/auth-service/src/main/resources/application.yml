server:
  port: ${AUTH_SERVICE_PORT:8085}

spring:
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties],optional:file:ClinicAppointmentBE/.env[.properties]"
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_AUTH_PORT:5438}/${AUTH_DB_NAME:auth_db}
    username: ${DB_USERNAME:fclinic_admin}
    password: ${DB_PASSWORD:fclinic_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 16
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fclinic}/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fclinic}}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000

app:
  recipients:
    client-id: ${APPOINTMENT_RECIPIENT_CLIENT_ID:appointment-recipient-accounts}
    client-secret: ${APPOINTMENT_RECIPIENT_CLIENT_SECRET:}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:fclinic}
    client-id: ${KEYCLOAK_CLIENT_ID:fclinic-auth-service}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:fclinic-auth-secret-dev}
    web-client-id: ${KEYCLOAK_WEB_CLIENT_ID:fclinic-web}
    admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
    admin-username: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    connect-timeout-ms: ${KEYCLOAK_CONNECT_TIMEOUT_MS:10000}
    read-timeout-ms: ${KEYCLOAK_READ_TIMEOUT_MS:60000}
  introspection:
    clients:
      appointment:
        client-id: ${APPOINTMENT_AUTH_CLIENT_ID:appointment-introspection}
        client-secret: ${APPOINTMENT_AUTH_CLIENT_SECRET:}
    client-id: ${AUTH_INTROSPECTION_CLIENT_ID:patient-service}
    client-secret: ${AUTH_INTROSPECTION_CLIENT_SECRET:patient-introspection-secret-dev}
    issuer: ${AUTH_INTROSPECTION_ISSUER:${KEYCLOAK_BASE_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:fclinic}}
    default-audiences:
      - patient-service
      - auth-service
      - appointment-service
  authorization:
    clients:
      appointment:
        client-id: ${APPOINTMENT_SCOPE_CLIENT_ID:appointment-scope}
        secret: ${APPOINTMENT_SCOPE_CLIENT_SECRET:}
        contract-version: appointment-work-scope/1
        authority: ADMINISTRATIVE
      patient-administrative:
        client-id: ${PATIENT_ADMIN_SCOPE_CLIENT_ID:patient-admin-scope}
        secret: ${PATIENT_ADMIN_SCOPE_CLIENT_SECRET:}
        contract-version: patient-work-scope/2
        authority: ADMINISTRATIVE
      patient-clinical:
        client-id: ${PATIENT_CLINICAL_SCOPE_CLIENT_ID:patient-clinical-scope}
        secret: ${PATIENT_CLINICAL_SCOPE_CLIENT_SECRET:}
        contract-version: patient-work-scope/2
        authority: CLINICAL
    services:
      appointment:
        subject: ${APPOINTMENT_SERVICE_SUBJECT:22222222-2222-4222-8222-222222222205}
        name: appointment-service
        authorities: [SVC_PATIENT_READ]
    grants:
      "44444444-4444-4444-8444-444444444401":
        subject: ${APPOINTMENT_SERVICE_SUBJECT:22222222-2222-4222-8222-222222222205}
        operations: [APPOINTMENT_PROFILE_READ]
        all-patients: true
        active: true
  auth:
    otp:
      expiration-seconds: ${AUTH_OTP_EXPIRATION_SECONDS:300}
      expose-in-response: ${AUTH_OTP_EXPOSE_IN_RESPONSE:false}
      mail-enabled: ${AUTH_OTP_MAIL_ENABLED:true}
      from-address: ${MAIL_FROM_ADDRESS:no-reply@fclinic.local}

eureka:
  instance:
    prefer-ip-address: true
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

logging:
  level:
    com.fclinic.authservice: INFO

