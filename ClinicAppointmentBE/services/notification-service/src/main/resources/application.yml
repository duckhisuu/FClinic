server:
  port: 8084

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:fclinic_rabbit}
    password: ${RABBITMQ_DEFAULT_PASS:rabbit_secret}
    listener:
      simple:
        auto-startup: true
        concurrency: 1
        max-concurrency: 5

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

fclinic:
  rabbitmq:
    queue: fclinic.appointment.notifications
    exchange: fclinic.direct.exchange
    routingkey: appointment.booked

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
